{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "garmin-mcp.fullname" . }}
  labels:
    {{- include "garmin-mcp.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml (required "httpRoute.parentRefs is required when httpRoute.enabled" .Values.httpRoute.parentRefs) | nindent 4 }}
  hostnames:
    {{- toYaml (required "httpRoute.hostnames is required when httpRoute.enabled" .Values.httpRoute.hostnames) | nindent 4 }}
  rules:
    {{- if .Values.httpRoute.rewriteRootTo }}
    # Some MCP clients keep the configured path only for discovery and then
    # POST JSON-RPC to the origin root. The server serves exactly one MCP path,
    # so the root is rewritten onto it here rather than moved. The match is
    # Exact, so /login, /authorize, /token and /.well-known are untouched.
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: {{ .Values.httpRoute.rewriteRootTo | quote }}
      backendRefs:
        - name: {{ include "garmin-mcp.fullname" . }}
          port: {{ .Values.service.port }}
    {{- end }}
    - matches:
        {{- toYaml .Values.httpRoute.matches | nindent 8 }}
      backendRefs:
        - name: {{ include "garmin-mcp.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
