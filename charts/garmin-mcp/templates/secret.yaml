{{- if not .Values.oauth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "garmin-mcp.fullname" . }}-oauth
  labels:
    {{- include "garmin-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Carries the client secret digests, so it is a Secret and never the
  # ConfigMap the rest of the configuration lives in.
  GARMIN_MCP_OAUTH_CLIENTS: {{ include "garmin-mcp.oauthClientsJSON" . | quote }}
{{- end }}
