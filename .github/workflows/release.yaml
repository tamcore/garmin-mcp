name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

# A literal prefix, distinct from the one ci.yaml uses. See the note there: the
# called workflow inherits this workflow's github.workflow, so a shared
# expression makes the gates job cancel the run that started it.
#
# cancel-in-progress is false because a release must not be interrupted midway
# through publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GORELEASER_VERSION: v2.17.1
  COSIGN_VERSION: v2.6.5
  SYFT_VERSION: v1.51.0

jobs:
  # Publishing is gated on the full CI matrix re-running against the tagged
  # commit, so a tag can never ship artifacts that did not pass the gates.
  gates:
    name: Gates
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yaml

  release:
    name: GoReleaser
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload artifacts
      packages: write # push the OCI image to GHCR
      id-token: write # keyless cosign signing and attestation signing via GitHub OIDC
      attestations: write # upload build provenance attestations to the GH API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install cosign
        run: go install github.com/sigstore/cosign/v2/cmd/cosign@${{ env.COSIGN_VERSION }}

      - name: Install syft
        run: go install github.com/anchore/syft/cmd/syft@${{ env.SYFT_VERSION }}

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GoReleaser's own SBOM integration cannot catalog an image it just
      # pushed itself (only source, package, archive and binary artifacts are
      # cataloguable), so the container image SBOM is generated here instead,
      # after dockers_v2 has pushed it. The digest is recomputed from the raw
      # manifest bytes rather than parsed out of a buildx-specific struct, so
      # it matches whatever the registry actually serves.
      - name: Resolve pushed image digest
        id: image
        run: |
          ref="ghcr.io/tamcore/garmin-mcp:${GITHUB_REF_NAME}"
          digest="sha256:$(docker buildx imagetools inspect "${ref}" --raw | sha256sum | cut -d' ' -f1)"
          echo "ref=${ref}" >>"${GITHUB_OUTPUT}"
          echo "digest=${digest}" >>"${GITHUB_OUTPUT}"

      - name: Generate container image SBOM
        run: |
          syft "${{ steps.image.outputs.ref }}@${{ steps.image.outputs.digest }}" \
            -o "spdx-json=dist/garmin-mcp_image.spdx.json"

      # Attaches the image SBOM to the image itself as a keyless-signed in-toto
      # attestation, discoverable with `cosign verify-attestation`. Same
      # identity model as docker_signs and the checksum signing above.
      - name: Sign and attach container image SBOM
        run: |
          cosign attest --yes \
            --type spdxjson \
            --predicate dist/garmin-mcp_image.spdx.json \
            "${{ steps.image.outputs.ref }}@${{ steps.image.outputs.digest }}"

      # Build provenance for the file artifacts GoReleaser publishes: archives,
      # checksums, checksum signature/certificate, and the archive and binary
      # SBOMs.
      - name: Attest build provenance for release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*_SHA256SUMS
            dist/*_SHA256SUMS.sig
            dist/*_SHA256SUMS.pem
            dist/*.sbom.json

      # Build provenance for the pushed image, attached to the registry
      # alongside the SBOM attestation and the cosign signature above.
      - name: Attest build provenance for the container image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/tamcore/garmin-mcp
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
