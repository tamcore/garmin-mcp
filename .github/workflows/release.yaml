name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

# A literal prefix, distinct from the one ci.yaml uses. See the note there: the
# called workflow inherits this workflow's github.workflow, so a shared
# expression makes the gates job cancel the run that started it.
#
# cancel-in-progress is false because a release must not be interrupted midway
# through publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GORELEASER_VERSION: v2.17.1 # renovate: datasource=github-releases depName=goreleaser/goreleaser
  COSIGN_VERSION: v3.1.3 # renovate: datasource=github-releases depName=sigstore/cosign

jobs:
  # Publishing is gated on the full CI matrix re-running against the tagged
  # commit, so a tag can never ship artifacts that did not pass the gates.
  gates:
    name: Gates
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yaml

  release:
    name: GoReleaser
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload artifacts
      packages: write # push the OCI image to GHCR
      id-token: write # keyless cosign signing of the checksum file via GitHub OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  chart:
    # Publishes the Helm chart as an OCI artifact so a GitOps repository can
    # depend on a released version instead of vendoring a copy of this
    # directory. Chart version and appVersion both track the release tag, so
    # `helm show chart` names the image the chart defaults to.
    #
    # It runs after `release`, because the chart's appVersion points at an
    # image tag that must exist before the chart claiming it does.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: release
    permissions:
      contents: read
      packages: write # push the chart to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          helm package ./charts/garmin-mcp --version "$version" --app-version "$GITHUB_REF_NAME"
          helm push "garmin-mcp-${version}.tgz" oci://ghcr.io/tamcore/charts
