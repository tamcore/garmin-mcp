name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # The release workflow re-runs every gate before it publishes anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned tool versions. CI must never resolve a floating "latest".
  GOLANGCI_LINT_VERSION: v2.12.2
  GORELEASER_VERSION: v2.17.1
  GOVULNCHECK_VERSION: v1.7.0

jobs:
  verify:
    name: Verify tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Verify gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "::error::gofmt reported unformatted files:"
            echo "${unformatted}"
            gofmt -d .
            exit 1
          fi

      - name: Verify go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go vet
        run: go vet ./...

      # go vet uses the host GOOS, and the build matrix runs `go build`, which
      # never compiles _test.go. Without this, platform-specific code such as the
      # Windows ACL enforcement and its tests are never type-checked at all.
      - name: go vet for every supported GOOS
        run: |
          for os in linux darwin windows; do
            echo "== GOOS=${os}"
            GOOS="${os}" go vet ./... || exit 1
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      # Verifies the `formatters` block of .golangci.yml (gofmt + goimports) and
      # fails on any difference. Reuses the binary the action just installed.
      - name: Verify formatters (gofmt, goimports)
        run: golangci-lint fmt --diff

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: go test -race with coverage
        run: go test -race -count=1 -covermode=atomic -coverprofile=cover.out ./...

      - name: Coverage summary
        run: go tool cover -func=cover.out

  test-fakegarmin:
    name: Fake-Garmin integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # A tagged job that runs zero tagged tests reports success and proves
      # nothing. Fail before the suite runs if the tag matches no test file.
      - name: Assert the tagged suite exists
        run: |
          count=$(grep -rl '^//go:build fakegarmin' --include='*_test.go' . | wc -l | tr -d ' ')
          echo "fakegarmin-tagged test files: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::no fakegarmin-tagged test files found; this job would pass vacuously"
            exit 1
          fi

      - name: go test -tags=fakegarmin with coverage
        run: |
          go test -race -count=1 -tags=fakegarmin \
            -covermode=atomic -coverprofile=cover-fakegarmin.out ./...

      # Packages whose behavior is exercised mainly through the fake service are
      # undercounted by the untagged job, so report the tagged number too.
      - name: Coverage summary
        run: go tool cover -func=cover-fakegarmin.out | tail -20

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Assert the tagged suite exists
        run: |
          count=$(grep -rl '^func Test' --include='*_test.go' ./e2e | wc -l | tr -d ' ')
          echo "e2e test files: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::no tests found under ./e2e; this job would pass vacuously"
            exit 1
          fi

      - name: go test -tags=e2e
        run: go test -count=1 -tags=e2e -timeout=10m ./e2e/...

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: govulncheck
        run: govulncheck ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: go build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: goreleaser check
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: check

      # Snapshot build only: signing, SBOMs and image publishing need release
      # credentials and are exercised by the release workflow.
      - name: goreleaser snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=sign,sbom,docker

  container:
    name: Container build and hardening smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build linux/amd64 binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p image-context/linux/amd64
          go build -trimpath -ldflags '-s -w' \
            -o image-context/linux/amd64/garmin-mcp ./cmd/garmin-mcp

      - name: Build image
        run: |
          docker build \
            --build-arg TARGETPLATFORM=linux/amd64 \
            -f Dockerfile \
            -t garmin-mcp:ci \
            image-context

      - name: Assert numeric nonroot user
        run: |
          user="$(docker inspect -f '{{ .Config.User }}' garmin-mcp:ci)"
          echo "image user: ${user}"
          test "${user}" = "65532:65532"

      - name: Assert no shell in image
        run: |
          for shell in /bin/sh /bin/bash /busybox/sh; do
            if docker run --rm --entrypoint "${shell}" garmin-mcp:ci -c true 2>/dev/null; then
              echo "::error::unexpected shell ${shell} present in runtime image"
              exit 1
            fi
          done

      - name: Run hardened smoke test
        run: |
          docker run --rm \
            --read-only \
            --user 65532:65532 \
            --cap-drop=ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            garmin-mcp:ci
