{{define "title"}}Garmin Connect sign-in{{end}}
{{define "content"}}
<p>Enter your Garmin Connect credentials. They are used once, for this login,
and are never written to disk or to a log.</p>
<form method="post" action="/login" autocomplete="on">
<input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
<p>
<label for="email">Email address</label>
<input type="email" id="email" name="email" autocomplete="username"
inputmode="email" required maxlength="{{.MaxEmailLen}}" autofocus>
</p>
<p>
<label for="password">Password</label>
<input type="password" id="password" name="password"
autocomplete="current-password" required maxlength="{{.MaxPasswordLen}}">
</p>
<p><button type="submit">Sign in</button></p>
</form>
{{end}}
