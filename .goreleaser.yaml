# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: garmin-mcp

# No `before` hooks on purpose: CI already verifies `gofmt`, `goimports` and
# `go mod tidy` cleanliness, so the release must never mutate the tagged tree.

builds:
  - id: garmin-mcp
    main: ./cmd/garmin-mcp
    binary: garmin-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids:
      - garmin-mcp
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Explicit list: without it GoReleaser applies its own default set, which
    # does not carry the notices. Both files are a distribution condition of
    # the MIT licence and of the upstream MIT material recorded in the notices,
    # so every archive must contain them.
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - id: cosign-checksums
    cmd: cosign
    artifacts: checksum
    certificate: "${artifact}.pem"
    output: true
    args:
      - sign-blob
      - "--yes"
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"


dockers_v2:
  - id: ghcr
    ids:
      - garmin-mcp
    images:
      - "ghcr.io/tamcore/garmin-mcp"
    dockerfile: Dockerfile
    # The Dockerfile COPYs both files, so they must be in the build context
    # that GoReleaser assembles; only the binaries are there by default.
    extra_files:
      - LICENSE
      - THIRD_PARTY_NOTICES.md
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Tag }}"
      - "{{ .Major }}.{{ .Minor }}"
      - latest
    labels:
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.name: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: "{{ .GitURL }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 99

release:
  draft: false
  prerelease: auto
